<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gastos</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.37);
      --accent-green: #30D158;
      --accent-red: #FF453A;
      --accent-blue: #0A84FF;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Liquid Lights Background */
    .liquid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: #0d0e15;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 280px;
      height: 280px;
      background: #0A84FF;
      top: -40px;
      left: -40px;
    }

    .blob-2 {
      width: 320px;
      height: 320px;
      background: #BF5AF2;
      bottom: -60px;
      right: -40px;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 200px;
      height: 200px;
      background: #30D158;
      top: 40%;
      left: 30%;
      animation-delay: -8s;
      opacity: 0.3;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.1); }
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Common Glass Card Style */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--glass-shadow);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Balance Section */
    .balance-card {
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .balance-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
    }

    .income { color: var(--accent-green); }
    .expense { color: var(--accent-red); }

    /* Form Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-glass {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-glass:focus {
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.1);
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .type-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px;
      border-radius: 16px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .type-btn.active-expense {
      background: rgba(255, 69, 58, 0.2);
      border-color: var(--accent-red);
      color: #FFF;
    }

    .type-btn.active-income {
      background: rgba(48, 209, 88, 0.2);
      border-color: var(--accent-green);
      color: #FFF;
    }

    .btn-submit {
      background: var(--text-main);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      margin-top: 4px;
    }

    .btn-submit:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Transactions List */
    .history-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .tx-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-title {
      font-size: 15px;
      font-weight: 500;
    }

    .tx-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .tx-amount {
      font-size: 16px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <header>
      <div>
        <h1>Finanzas</h1>
        <div class="subtitle">Seguimiento personal</div>
      </div>
    </header>

    <!-- Balance Card -->
    <div class="glass-card balance-card">
      <div class="balance-title">Balance Total</div>
      <div class="balance-amount" id="balance">$0.00</div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Ingresos</span>
          <span class="stat-value income" id="income">+$0.00</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Gastos</span>
          <span class="stat-value expense" id="expenses">-$0.00</span>
        </div>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <div class="glass-card">
      <form id="form" class="form-group">
        <div class="type-selector">
          <button type="button" class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">Gasto</button>
          <button type="button" class="type-btn" id="btn-income" onclick="setType('income')">Ingreso</button>
        </div>

        <input type="text" id="text" class="input-glass" placeholder="Descripción (ej. Supermercado)" required>
        <input type="number" id="amount" class="input-glass" placeholder="Monto ($)" step="0.01" required>

        <button type="submit" class="btn-submit">Registrar</button>
      </form>
    </div>

    <!-- History -->
    <div>
      <div class="history-title">Movimientos</div>
      <div class="transaction-list" id="list">
        <div class="empty-state">No hay movimientos registrados</div>
      </div>
    </div>
  </div>

  <script>
    let currentType = 'expense';
    let transactions = JSON.parse(localStorage.getItem('apple_glass_transactions')) || [];

    function setType(type) {
      currentType = type;
      const btnExpense = document.getElementById('btn-expense');
      const btnIncome = document.getElementById('btn-income');

      if (type === 'expense') {
        btnExpense.className = 'type-btn active-expense';
        btnIncome.className = 'type-btn';
      } else {
        btnIncome.className = 'type-btn active-income';
        btnExpense.className = 'type-btn';
      }
    }

    function updateValues() {
      const amounts = transactions.map(t => t.type === 'income' ? t.amount : -t.amount);
      const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);
      
      const income = transactions
        .filter(t => t.type === 'income')
        .reduce((acc, t) => (acc += t.amount), 0)
        .toFixed(2);

      const expenses = transactions
        .filter(t => t.type === 'expense')
        .reduce((acc, t) => (acc += t.amount), 0)
        .toFixed(2);

      document.getElementById('balance').innerText = `$${total}`;
      document.getElementById('income').innerText = `+$${income}`;
      document.getElementById('expenses').innerText = `-$${expenses}`;
    }

    function renderList() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      if (transactions.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay movimientos registrados</div>';
        return;
      }

      transactions.slice().reverse().forEach((transaction, index) => {
        const item = document.createElement('div');
        item.classList.add('transaction-item');

        const isIncome = transaction.type === 'income';
        const sign = isIncome ? '+' : '-';
        const colorClass = isIncome ? 'income' : 'expense';

        item.innerHTML = `
          <div class="tx-info">
            <span class="tx-title">${transaction.text}</span>
            <span class="tx-date">${transaction.date}</span>
          </div>
          <span class="tx-amount ${colorClass}">${sign}$${transaction.amount.toFixed(2)}</span>
        `;
        list.appendChild(item);
      });
    }

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const textInput = document.getElementById('text');
      const amountInput = document.getElementById('amount');

      if (!textInput.value.trim() || !amountInput.value) return;

      const newTransaction = {
        id: Date.now(),
        text: textInput.value,
        amount: parseFloat(amountInput.value),
        type: currentType,
        date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })
      };

      transactions.push(newTransaction);
      localStorage.setItem('apple_glass_transactions', JSON.stringify(transactions));

      textInput.value = '';
      amountInput.value = '';

      updateValues();
      renderList();
    });

    // Init App
    updateValues();
    renderList();
  </script>
</body>
</html>
